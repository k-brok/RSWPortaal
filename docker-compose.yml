services:

  # ── Applicatie ────────────────────────────────────────────────
  app:
    image: chunkk/rsw-portaal:latest
    container_name: rsw-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: http://localhost:3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-rsw_portaal}
      DB_USER: ${DB_USER:-rsw_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL:-}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET}
      QR_DEFAULT_EXPIRY_MINUTES: 120
      BCRYPT_ROUNDS: 12
